<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منصه عمر جوهر</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:linear-gradient(135deg,#FFFDF8,#F9F3E8);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:420px;
max-width:100%;
background:white;
border-radius:30px;
padding:35px;
text-align:center;
box-shadow:0 15px 45px rgba(0,0,0,.08);
}

.logo{
width:140px;
height:140px;
border-radius:30px;
object-fit:cover;
box-shadow:0 10px 25px rgba(212,175,55,.25);
margin-bottom:20px;
}

h1{
color:#B8860B;
font-size:38px;
margin-bottom:10px;
}

p{
color:#666;
line-height:1.9;
font-size:18px;
margin-bottom:25px;
}

.features{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-bottom:30px;
}

.item{
background:#FFF8EA;
padding:15px;
border-radius:18px;
font-size:15px;
color:#555;
font-weight:600;
}

.download{
display:inline-block;
width:100%;
padding:18px;
background:linear-gradient(45deg,#C79A28,#F3D27A);
color:white;
text-decoration:none;
font-size:22px;
font-weight:bold;
border-radius:50px;
transition:.3s;
}

.download:hover{
transform:scale(1.04);
box-shadow:0 10px 25px rgba(199,154,40,.4);
}

.footer{
margin-top:25px;
font-size:14px;
color:#888;
}
</style>

</head>
<body>

<div class="card">

<img src="logo.png" class="logo">

<h1>منصه عمر جوهر</h1>

<p>
منصة تعليمية متكاملة توفر تجربة تعليمية حديثة وسهلة للوصول إلى جميع الدروس والاختبارات في أي وقت.
</p>

<div class="features">

<div class="item">📚 محتوى متجدد</div>

<div class="item">🎥 فيديوهات عالية الجودة</div>

<div class="item">📝 اختبارات إلكترونية</div>

<div class="item">⚡ سرعة وأمان</div>

</div>

<a class="download"
href="https://drive.google.com/uc?export=download&id=19kwTbEzLLX-hs7D4zB39w0sOUA-bleYi">
📥 تحميل التطبيق
</a>

<div class="footer">
الإصدار الأخير من التطبيق
</div>

</div>

</body>
</html>
